$kind: http-request
name: 'P8-069 Teacher A xem lớp B (expect 403/404)'
order: 2000
url: '{{baseUrl}}/api/classes/{{classBId}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Đăng nhập bằng TEACHER A trước khi chạy
      // classBId là lớp do Teacher B phụ trách
      pm.test("P8-069: Teacher A xem lớp B (không phải lớp mình) bị chặn", function () {
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
      pm.test("P8-069: Không trả dữ liệu lớp B (IDOR check)", function () {
        if (pm.response.code === 200) {
          pm.expect.fail("IDOR VULNERABILITY: Teacher A có thể đọc lớp B!");
        }
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
