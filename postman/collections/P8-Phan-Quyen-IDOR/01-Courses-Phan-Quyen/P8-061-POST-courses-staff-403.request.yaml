$kind: http-request
name: P8-061 POST courses bằng staff (expect 403)
order: 2000
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{runTag}}-STAFF-COURSE",
      "name": "Staff tạo khóa học",
      "totalSessions": 64,
      "sessionsPerWeek": 2,
      "durationMonths": 8,
      "listPrice": 5000000,
      "status": "PUBLISHED"
    }
scripts:
  - type: afterResponse
    code: |-
      // Đăng nhập bằng STAFF trước khi chạy request này
      pm.test("P8-061: Staff POST /courses trả 403", function () {
        pm.expect(pm.response.code).to.equal(403);
      });
    language: text/javascript
