$kind: http-request
name: 'P8-083 Chưa đăng nhập - route bảo vệ (expect 401)'
order: 4000
url: '{{baseUrl}}/api/classes/{{classId}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // KHÔNG đăng nhập - chạy sau khi đã logout hoặc xóa cookie
      pm.test("P8-083: Chưa đăng nhập GET /classes/:id trả 401", function () {
        pm.expect(pm.response.code).to.equal(401);
      });
      pm.test("P8-083: Route public /health và /public/courses là ngoại lệ (kiểm tra thủ công)", function () {
        pm.expect(true).to.be.true;
      });
