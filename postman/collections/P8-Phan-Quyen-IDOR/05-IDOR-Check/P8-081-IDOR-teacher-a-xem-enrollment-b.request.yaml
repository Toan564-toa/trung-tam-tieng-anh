$kind: http-request
name: 'P8-081 IDOR: Teacher A xem enrollment lớp B'
order: 2000
url: '{{baseUrl}}/api/classes/{{classBId}}/students'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Đăng nhập bằng TEACHER A trước khi chạy
      pm.test("P8-081 IDOR: Teacher A không được xem students lớp B", function () {
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
      pm.test("P8-081 IDOR: Không trả tên/email/mã học viên lớp B", function () {
        if (pm.response.code === 200) {
          pm.expect.fail("IDOR VULNERABILITY DETECTED: Teacher A có thể đọc students lớp B!");
        }
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
