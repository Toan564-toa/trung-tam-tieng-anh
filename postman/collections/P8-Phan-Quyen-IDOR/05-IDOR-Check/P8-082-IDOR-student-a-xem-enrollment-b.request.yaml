$kind: http-request
name: 'P8-082 IDOR: Student A xem enrollment Student B'
order: 3000
url: '{{baseUrl}}/api/enrollments/{{enrollmentAId}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Đăng nhập bằng STUDENT B trước khi chạy
      // enrollmentAId là enrollment của Student A
      pm.test("P8-082 IDOR: Student B không được xem enrollment của Student A", function () {
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
      pm.test("P8-082 IDOR: Không trả chi tiết enrollment của người khác", function () {
        if (pm.response.code === 200) {
          pm.expect.fail("IDOR VULNERABILITY DETECTED: Student B có thể đọc enrollment của Student A!");
        }
        pm.expect(pm.response.code).to.be.oneOf([403, 404]);
      });
