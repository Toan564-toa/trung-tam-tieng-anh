$kind: http-request
name: P8-029 Sinh buổi học từ lịch (generate-sessions)
order: 1000
url: "{{baseUrl}}/api/classes/{{classId}}/generate-sessions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "startDate": "2026-11-02",
      "weekdays": [1, 3],
      "timeSlotId": 6,
      "roomId": {{roomId}},
      "skipHolidays": ["2026-12-25", "2027-01-01", "2027-01-29", "2027-01-30"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("P8-029: Generate sessions trả 2xx", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("P8-029: Sinh đủ 64 buổi theo totalSessions khóa học", function () {
        const body = pm.response.json();
        const data = body.data || body;
        // API trả { items: [...], total: N, page, pageSize, totalPages }
        const count = data.total ?? (data.items && data.items.length);
        pm.expect(count, "Số buổi học phải đúng 64").to.equal(64);
      });
      pm.test("P8-029: Sử dụng timeSlotId (auto-fill giờ)", function () {
        const body = pm.response.json();
        const data = body.data || body;
        // Verify sessions use timeSlotId 6 (CA6: 17:00-18:30)
        if (data.items && data.items.length > 0) {
          pm.expect(data.items[0].startTime).to.equal('17:00');
          pm.expect(data.items[0].endTime).to.equal('18:30');
        }
      });
