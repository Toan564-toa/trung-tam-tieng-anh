$kind: http-request
name: 'P8-025 Danh sách sessions của lớp'
order: 1000
url: '{{baseUrl}}/api/classes/{{classId}}/sessions?page=1&pageSize=20'
method: GET
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("P8-025: Danh sách sessions trả 2xx", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("P8-025: Response có pagination envelope", function () {
        const body = pm.response.json();
        const data = body.data || body;
        pm.expect(data).to.have.property("items");
        pm.expect(data).to.have.property("total");
      });
      pm.test("P8-025: Lưu sessionAId nếu có", function () {
        const body = pm.response.json();
        const items = (body.data && body.data.items) || body.items || [];
        if (items.length > 0) {
          pm.environment.set("sessionAId", items[0].id);
        }
      });
