$kind: http-request
name: 'P8-028 Thời khóa biểu tổng hợp'
order: 4000
url: '{{baseUrl}}/api/classes/timetable?from=2026-11-01&to=2026-11-30&page=1&pageSize=50'
method: GET
queryParams:
  - key: from
    value: '2026-11-01'
  - key: to
    value: '2026-11-30'
  - key: page
    value: '1'
  - key: pageSize
    value: '50'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("P8-028: GET /timetable vào đúng handler", function () {
        const code = pm.response.code;
        if (code === 404) {
          console.log("P8-028 CẢNH BÁO: Route /timetable bị bắt bởi /:id handler - cần sửa thứ tự route");
        }
        pm.expect(code).to.be.oneOf([200, 201, 400]);
      });
