$kind: http-request
name: 'P8-006: POST /api/auth/login (teacher A)'
order: 2000
method: POST
url: '{{baseUrl}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{teacherAUsername}}",
      "password": "{{teacherAPassword}}",
      "portal": "client"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("P8-006: Login teacher A trả 2xx", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
