$kind: http-request
name: 'P8-001: GET /health'
order: 1000
method: GET
url: '{{baseUrl}}/health'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("P8-001: Health check trả 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });
      pm.test("P8-001: Response có trường status OK", function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property("status");
      });
