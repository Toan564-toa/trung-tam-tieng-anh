$kind: http-request
name: 'P8-341 Chi tiết ghi danh (admin)'
order: 1000
url: '{{baseUrl}}/api/enrollments/{{enrollmentAId}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("P8-341: Chi tiết ghi danh trả 2xx", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("P8-341: Trả đúng enrollmentId", function () {
        const body = pm.response.json();
        const data = body.data || body;
        pm.expect(String(data.id)).to.equal(String(pm.environment.get("enrollmentAId")));
      });
      pm.test("P8-341: ID không tồn tại trả 404 (kiểm tra thủ công với ID giả)", function () {
        pm.expect(true).to.be.true;
      });
